    <!-- DIV DE TEST - Informations utilisateur connecté -->
    <div id="user-debug-bar" class="bg-warning text-dark p-2 small" style="font-family: monospace;">
        <div class="container">
            <strong>🔧 DEBUG USER:</strong>
            <span id="debug-user-info">Aucun utilisateur connecté</span>
        </div>
    </div>
    <script>
        // Met à jour la barre de debug avec les infos utilisateur
        function updateUserDebugBar() {
            const debugInfo = document.getElementById('debug-user-info');
            if (!debugInfo) return;

            try {
                const user = JSON.parse(sessionStorage.getItem('user'));
                if (user) {
                    debugInfo.innerHTML = `
                        <strong>ID:</strong> ${user.id || 'N/A'} | 
                        <strong>Nom:</strong> ${user.nom || 'N/A'} | 
                        <strong>Prénom:</strong> ${user.prenom || 'N/A'} | 
                    `;
                } else {
                    debugInfo.textContent = 'Aucun utilisateur connecté';
                }
            } catch (e) {
                debugInfo.textContent = 'Erreur lecture session';
            }
        }

        // Mise à jour au chargement et périodiquement
        document.addEventListener('DOMContentLoaded', updateUserDebugBar);
        setInterval(updateUserDebugBar, 1000);
    </script>
