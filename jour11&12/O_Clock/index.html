<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O_Clock</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="bootwatchLumen.css">

    <script src="scripts.js" defer></script>
</head>

<body>
    <div>
        <div>
            <button class="btn btn-outline-primary" id="btnHorloge"> <i class="fa-regular fa-clock"></i>Horloge</button>
            <button class="btn btn-outline-primary" id="btnReveil"> <i
                    class="fa-regular fa-alarm-clock"></i>Reveil</button>
            <button class="btn btn-outline-primary" id="btnChronometre"> <i
                    class="fa-regular fa-timer"></i>Chronometre</button>
            <button class="btn btn-outline-primary" id="btnMinuteur"> <i
                    class="fa-regular fa-clock"></i>Minuteur</button>
        </div>
        <main>
            <div id="Chronometre" style="display: none;">
                <button class="btn2" id="btnMarcheArret"><i class="fa-solid fa-play"></i>Demarrer</button>
                <button class="btn2" id="btnReset"><i class="fa-solid fa-rotate"></i>Reset</button>
                <button class="btn3" id="btnTour">Tour</button>
                <div id="AfficherChrono">00:00:00:000</div>
                <ul id="AfficherTour">

                </ul>
            </div>

            <div id="Minuteur" style="display: none;">
                <div id="AfficherMinuteur">00:00:00</div>
                <button class="fleche" id="btnFlecheHaut"><i class="fa-solid fa-arrow-up"></i></button>
                <button class="fleche" id="btnFlecheBas"><i class="fa-solid fa-arrow-down"></i></button>
                <input type="number" id="MinuteurMinutes" min="0" max="59" placeholder="MM" style="width: 50px;">
                <span>:</span>
                <input type="number" id="MinuteurSecondes" min="0" max="59" placeholder="SS" style="width: 50px;">
                <button class="btn2" id="btnMinuteurMarcheArret"><i class="fa-solid fa-play"></i>Demarrer</button>
            </div>

            <div id="Reveil" style="display: none;">
                <div id="AlarmeHeure"></div>
                <input type="time">
                <input type="text">
                <button id="btnAjouterAlarme"><i class="fa-solid fa-plus"></i>Ajouter une Alarme</button>
                <ul id="AfficherAlarme">
                </ul>
            </div>
            <!-- 
            <div>
                <input type="number" id="heure" placeholder="00">
                <input type="number" id="minute" placeholder="00">
                <input type="number" id="seconde" placeholder="00">
            </div> -->



            <div id="Horloge" style="display: none;"></div>

        </main>
    </div>

</body>

</html>
